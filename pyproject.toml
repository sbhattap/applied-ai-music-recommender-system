[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-music-recommender-system"
version = "0.1.0"
description = "Agentic music recommender: hybrid RAG retrieval, explainable ranking, cited Claude explanations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.3.0",
  "fastembed>=0.9.1",
  "pandas",
  "pydantic>=2.0",
  "python-dotenv",
  "streamlit",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
