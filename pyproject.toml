[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-music-recommender-system"
version = "0.1.0"
description = "Music recommender system with deterministic ranking and LLM-assisted explanations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.0.0",
  "pandas",
  "pydantic>=2.0",
  "python-dotenv",
  "streamlit",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
